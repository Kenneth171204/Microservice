version: '3.8'
services:
  restaurant_db:
    image: mysql:8.0
    container_name: restaurant_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3307:3306"
    networks:
      - food_delivery_net

  order_db:
    image: mysql:8.0
    container_name: order_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
    ports:
      - "3308:3306"
    networks:
      - food_delivery_net

  delivery_db:
    image: mysql:8.0
    container_name: delivery_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: delivery_db
    ports:
      - "3309:3306"
    networks:
      - food_delivery_net

  redis-db:
    image: redis:alpine
    container_name: food_delivery_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - food_delivery_net

networks:
  food_delivery_net:
    external: true