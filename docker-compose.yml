services:
  mysql-db:
    image: mysql:8.0
    container_name: food_delivery_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_delivery
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - food_delivery_net

  redis-db:
    image: redis:alpine
    container_name: food_delivery_redis
    ports:
      - "6379:6379"
    networks:
      - food_delivery_net

networks:
  food_delivery_net:
    external: true